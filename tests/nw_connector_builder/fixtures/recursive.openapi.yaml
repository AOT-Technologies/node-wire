openapi: 3.0.3
info:
  title: Recursive demo
  version: "1.0"
servers:
  - url: https://api.example.com/v1
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    Message:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        replies:
          type: array
          items:
            $ref: "#/components/schemas/Message"
    Team:
      type: object
      properties:
        id:
          type: string
        channels:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
    Channel:
      type: object
      properties:
        id:
          type: string
        team:
          $ref: "#/components/schemas/Team"
    Error:
      type: object
      properties:
        code:
          type: string
security:
  - bearer: []
paths:
  /messages:
    post:
      operationId: create_message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Message"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /teams/{team_id}:
    get:
      operationId: get_team
      parameters:
        - name: team_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
