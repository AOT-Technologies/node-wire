# OpenAPI 3.0 conformance fixture: one operation per construct the generator covers.
# docs/cli/openapi-coverage.md lists every OpenAPI field and how it is handled.
openapi: 3.0.4
info: {title: Coverage 3.0, version: "1"}
servers:
  - url: https://{region}.api.example.com/v1
    variables:
      region: {default: eu, enum: [eu, us]}
security:
  - bearer: []
paths:
  /items/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: verbose, in: query, schema: {type: string}}
    get:
      operationId: getItem
      summary: Read one item.
      parameters:
        # Overrides the path-level `verbose` (same name and location).
        - {name: verbose, in: query, schema: {type: boolean}}
        - {name: Accept, in: header, schema: {type: string}}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {type: object, properties: {id: {type: string}}}
  /styles/{label}/{matrix}:
    get:
      operationId: styles
      parameters:
        - {name: label, in: path, required: true, style: label, explode: true, schema: {type: array, items: {type: string}}}
        - {name: matrix, in: path, required: true, style: matrix, schema: {type: array, items: {type: string}}}
        - {name: tags, in: query, style: pipeDelimited, explode: false, schema: {type: array, items: {type: string}}}
        - {name: words, in: query, style: spaceDelimited, explode: false, schema: {type: array, items: {type: string}}}
        - {name: filter, in: query, style: deepObject, explode: true, schema: {type: object, additionalProperties: {type: string}}}
        - {name: next, in: query, allowReserved: true, schema: {type: string}}
        - {name: where, in: query, content: {application/json: {schema: {type: object}}}}
        - {name: X-Meta, in: header, explode: true, schema: {type: object, additionalProperties: {type: integer}}}
        - {name: session, in: cookie, schema: {type: string}}
      responses:
        "204": {description: done}
  /limits:
    get:
      operationId: limits
      deprecated: true
      servers: [{url: https://other.example.com}]
      parameters:
        - {name: page, in: query, required: true, schema: {type: integer, minimum: 1, maximum: 100, multipleOf: 1}}
        - {name: ratio, in: query, schema: {type: number, minimum: 0, exclusiveMinimum: true}}
        - {name: code, in: query, required: true, schema: {type: string, minLength: 3, maxLength: 3, pattern: "^[A-Z]+$"}}
        - {name: level, in: query, schema: {type: integer, enum: [1, 2, 3]}}
        - {name: ids, in: query, schema: {type: array, items: {type: integer}, minItems: 1, maxItems: 5}}
        - {name: when, in: query, schema: {type: string, format: date-time}}
      responses:
        default:
          description: The only declared response.
          content:
            application/json:
              schema: {type: object}
  /bodies/json:
    post:
      operationId: postJson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                id: {type: string, readOnly: true}
            example: {name: n}
      responses: {"201": {description: created}}
  /bodies/form:
    post:
      operationId: postForm
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema: {type: object, properties: {flag: {type: boolean}, tags: {type: array, items: {type: string}}}}
      responses: {"200": {description: ok}}
  /bodies/multipart:
    post:
      operationId: upload
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: {type: string, format: binary}
                note: {type: string}
            encoding:
              file: {contentType: image/png}
      responses: {"200": {description: ok}}
  /bodies/text:
    post:
      operationId: postText
      requestBody:
        content:
          text/plain:
            schema: {type: string}
            example: {text: "an object where the schema says string"}
      responses: {"200": {description: ok}}
  /bodies/xml:
    post:
      operationId: postXml
      requestBody:
        content:
          application/xml:
            schema: {type: object, xml: {name: item}}
      responses: {"200": {description: ok}}
  /bodies/raw:
    put:
      operationId: putRaw
      requestBody:
        content:
          application/octet-stream: {}
      responses: {"200": {description: ok}}
  /both:
    get:
      operationId: needsBoth
      security:
        - {bearer: [], apiKey: []}
      responses: {"200": {description: ok}}
  /xml-out:
    get:
      operationId: xmlOut
      requestBody:
        content: {application/json: {schema: {type: object, properties: {ignored: {type: string}}}}}
      parameters:
        - {name: prefs, in: cookie, schema: {type: array, items: {type: string}}}
      responses:
        "200":
          description: ok
          content:
            application/xml:
              schema: {type: object, properties: {id: {type: string}}}
  /public:
    get:
      operationId: publicThing
      security: []
      callbacks:
        onEvent:
          "{$request.query.url}":
            post:
              requestBody: {content: {application/json: {schema: {type: object}}}}
              responses: {"200": {description: ok}}
      responses:
        "200":
          description: ok
          links:
            item:
              operationId: getItem
              parameters: {id: $response.body#/id}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
    apiKey: {type: apiKey, in: header, name: X-Api-Key}
