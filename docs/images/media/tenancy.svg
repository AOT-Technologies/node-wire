  <title id="t">Tenant-pinned connectors</title>
  <desc id="d">Requests from tenants acme and globex reach ConnectorFactory, which resolves each tenant&#x27;s own config and secrets from the config store and returns an instance pinned to that tenant. A tenant with no config, initech, is refused.</desc>
  <style>
    text { font-family: Inter, 'SF Pro Text', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #111827; }
    .t { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
    .b { font-size: 11.5px; fill: #6b7280; }
    .k { font-size: 10px; font-weight: 600; fill: #9ca3af; letter-spacing: 0.08em; }
    .m { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 11px; fill: #6b7280; }
    .mi { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 11px; fill: #111827; }
    .ln { fill: none; stroke: #d1d5db; stroke-width: 1; }
    .er { fill: none; stroke: #e01d5a; stroke-width: 1; stroke-opacity: .45; }
    .dot { offset-rotate: 0deg; animation: travel var(--d, 3s) cubic-bezier(.45,0,.55,1) infinite;
           animation-delay: var(--w, 0s); opacity: 0; }
    .hl { opacity: 0; animation: hl var(--d, 6s) ease-in-out infinite; animation-delay: var(--w, 0s); }
    .in { opacity: 0; animation: fadein var(--d, 8s) ease-out infinite; animation-delay: var(--w, 0s); }
    @keyframes travel { 0% { offset-distance: 0%; opacity: 0; } 10% { opacity: 1; }
                        85% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes hl { 0%, 22%, 100% { opacity: 0; } 4%, 16% { opacity: 1; } }
    @keyframes fadein { 0% { opacity: 0; transform: translateY(4px); } 8%, 82% { opacity: 1; transform: none; }
                        92%, 100% { opacity: 0; } }
    .bar { transform-box: fill-box; transform-origin: left; animation: grow 8s ease-in-out infinite; }
    @keyframes grow { 0% { transform: scaleX(0); } 70%, 90% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    @media (prefers-reduced-motion: reduce) {
      .dot, .hl { animation: none; opacity: 0; }
      .in, .bar { animation: none; opacity: 1; }
    }
  </style>
  <rect width="960" height="250" rx="12" fill="#ffffff"/>
  <rect x=".5" y=".5" width="959" height="249" rx="12" fill="none" stroke="#e5e7eb"/>
  <text x="40" y="40" class="k" text-anchor="start">CALLERS</text>
  <rect x="40" y="56" width="180" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="54" y="78.0" class="t" text-anchor="start">acme</text>
  <text x="54" y="94.0" class="b" text-anchor="start">X-Tenant-ID header</text>
  <rect x="40" y="120" width="180" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="54" y="142.0" class="t" text-anchor="start">globex</text>
  <text x="54" y="158.0" class="b" text-anchor="start">JWT tenant claim</text>
  <rect x="40" y="184" width="180" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="54" y="206.0" class="t" text-anchor="start">initech</text>
  <text x="54" y="222.0" class="b" text-anchor="start">no config</text>
  <text x="390" y="40" class="k" text-anchor="start">RESOLVE</text>
  <rect x="390" y="96" width="180" height="58" rx="7" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="404" y="122.0" class="t" text-anchor="start">ConnectorFactory</text>
  <text x="404" y="138.0" class="m" text-anchor="start">get(id, tenant_id)</text>
  <rect x="400" y="184" width="160" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="414" y="206.0" class="t" text-anchor="start">Config store</text>
  <text x="414" y="222.0" class="b" text-anchor="start">configs · secrets</text>
  <path class="ln" d="M480 154 L 480 184"/>
  <text x="740" y="40" class="k" text-anchor="start">INSTANCES</text>
  <rect x="740" y="56" width="190" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="754" y="78.0" class="t" text-anchor="start">Pinned to acme</text>
  <text x="754" y="94.0" class="b" text-anchor="start">acme&#x27;s credentials only</text>
  <rect x="740" y="120" width="190" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="754" y="142.0" class="t" text-anchor="start">Pinned to globex</text>
  <text x="754" y="158.0" class="b" text-anchor="start">globex&#x27;s credentials only</text>
  <rect x="740" y="184" width="190" height="50" rx="7" fill="#ffffff" stroke="#f3c0cf"/>
  <text x="754" y="206.0" class="t" text-anchor="start">Refused</text>
  <text x="754" y="222.0" class="b" text-anchor="start">fails closed · 403</text>
  <path class="ln" d="M220 81 C 305 81, 305 125, 390 125"/>
  <path class="ln" d="M220 145 C 305 145, 305 125, 390 125"/>
  <path class="ln" d="M220 209 C 305 209, 305 125, 390 125"/>
  <path class="ln" d="M570 125 C 655 125, 655 81, 740 81"/>
  <path class="ln" d="M570 125 L 740 145"/>
  <path class="er" d="M570 125 C 655 125, 655 209, 740 209"/>
  <circle class="dot" r="3" fill="#1a9fc8" style="offset-path: path('M220 81 C 305 81, 305 125, 390 125 L 570 125 C 655 125, 655 81, 740 81'); --d: 4s; --w: 0s"/>
  <circle class="dot" r="3" fill="#1a9fc8" style="offset-path: path('M220 145 C 305 145, 305 125, 390 125 L 570 125 L 740 145'); --d: 4s; --w: 1.3s"/>
  <circle class="dot" r="3" fill="#e01d5a" style="offset-path: path('M220 209 C 305 209, 305 125, 390 125 L 570 125 C 655 125, 655 209, 740 209'); --d: 4s; --w: 2.6s"/>
</svg>
