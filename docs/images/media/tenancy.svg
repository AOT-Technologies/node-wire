<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-labelledby="t d">
  <!--
  SPDX-FileCopyrightText: 2026 AOT Technologies
  SPDX-License-Identifier: Apache-2.0
  -->
  <title id="t">Tenant-pinned connectors</title>
  <desc id="d">Requests from tenants acme and globex reach ConnectorFactory, which resolves each tenant's own config and secrets from the config store and returns an instance pinned to that tenant. A tenant with no config, initech, is refused with 403.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1c2733; }
    .h { font-size: 13px; font-weight: 700; }
    .s { font-size: 11px; fill: #4a5a6a; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
    .flow { fill: none; stroke-width: 2; stroke-dasharray: 5 6; animation: dash 1.1s linear infinite; }
    .p { animation: go 4.5s ease-in-out infinite; }
    .p2 { animation-delay: 1.5s; } .p3 { animation-delay: 3s; }
    .deny { animation: deny 4.5s ease-in-out infinite; animation-delay: 3s; opacity: 0; }
    @keyframes dash { to { stroke-dashoffset: -22; } }
    @keyframes go { 0% { offset-distance: 0%; opacity: 0; } 6% { opacity: 1; } 50% { offset-distance: 100%; opacity: 1; } 56%,100% { offset-distance: 100%; opacity: 0; } }
    @keyframes deny { 0%,30% { opacity: 0; } 36%,60% { opacity: 1; } 70%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .flow, .p { animation: none; } .p { opacity: 0; } .deny { animation: none; opacity: 1; } }
  </style>

  <rect width="960" height="260" rx="16" fill="#ffffff"/>
  <rect x="1" y="1" width="958" height="258" rx="16" fill="none" stroke="#d8dee6"/>

  <!-- Tenants -->
  <rect x="24" y="36" width="150" height="46" rx="10" fill="#ddf1fb" stroke="#1a88b0"/>
  <text x="99" y="56" class="h" text-anchor="middle" fill="#0d2f3d">acme</text>
  <text x="99" y="72" class="mono" text-anchor="middle" fill="#0d2f3d" font-size="10">X-Tenant-ID: acme</text>
  <rect x="24" y="106" width="150" height="46" rx="10" fill="#ddf1fb" stroke="#1a88b0"/>
  <text x="99" y="126" class="h" text-anchor="middle" fill="#0d2f3d">globex</text>
  <text x="99" y="142" class="mono" text-anchor="middle" fill="#0d2f3d" font-size="10">JWT tenant claim</text>
  <rect x="24" y="176" width="150" height="46" rx="10" fill="#f2f4f7" stroke="#8a9bac"/>
  <text x="99" y="196" class="h" text-anchor="middle">initech</text>
  <text x="99" y="212" class="s" text-anchor="middle">no config</text>

  <path class="flow" stroke="#1a88b0" d="M174 59 C 230 59, 230 129, 300 129"/>
  <path class="flow" stroke="#1a88b0" d="M174 129 L 300 129"/>
  <path class="flow" stroke="#8a9bac" d="M174 199 C 230 199, 230 129, 300 129"/>

  <!-- Factory + store -->
  <rect x="300" y="92" width="196" height="74" rx="12" fill="#fffaf0" stroke="#b8860b" stroke-width="2"/>
  <text x="398" y="122" class="h" text-anchor="middle" fill="#3a2c05">ConnectorFactory</text>
  <text x="398" y="142" class="mono" text-anchor="middle" fill="#6b5410">get(id, tenant_id)</text>
  <rect x="316" y="190" width="164" height="44" rx="10" fill="#f2f4f7" stroke="#8a9bac"/>
  <text x="398" y="210" class="h" text-anchor="middle">Config store</text>
  <text x="398" y="225" class="s" text-anchor="middle">per-tenant configs + secrets</text>
  <path d="M398 166 L 398 190" stroke="#8a9bac" stroke-width="2" stroke-dasharray="3 4"/>

  <!-- Instances -->
  <path class="flow" stroke="#12867a" d="M496 129 C 560 129, 560 59, 620 59"/>
  <path class="flow" stroke="#12867a" d="M496 129 L 620 129"/>
  <path class="flow" stroke="#b81548" d="M496 129 C 560 129, 560 199, 620 199"/>

  <rect x="620" y="36" width="190" height="46" rx="10" fill="#ddf5f0" stroke="#12867a"/>
  <text x="715" y="56" class="h" text-anchor="middle" fill="#0b2f2a">instance · pinned to acme</text>
  <text x="715" y="72" class="s" text-anchor="middle" fill="#0b2f2a">acme's credentials only</text>
  <rect x="620" y="106" width="190" height="46" rx="10" fill="#ddf5f0" stroke="#12867a"/>
  <text x="715" y="126" class="h" text-anchor="middle" fill="#0b2f2a">instance · pinned to globex</text>
  <text x="715" y="142" class="s" text-anchor="middle" fill="#0b2f2a">globex's credentials only</text>
  <rect x="620" y="176" width="190" height="46" rx="10" fill="#fde2ea" stroke="#b81548"/>
  <text x="715" y="196" class="h" text-anchor="middle" fill="#3d0a1d">refused · 403</text>
  <text x="715" y="212" class="s" text-anchor="middle" fill="#3d0a1d">fails closed, no outbound call</text>
  <g class="deny"><circle cx="806" cy="178" r="11" fill="#b81548"/><text x="806" y="183" class="h" text-anchor="middle" fill="#ffffff">✕</text></g>

  <text x="884" y="104" class="s" text-anchor="middle" font-weight="700">A config</text>
  <text x="884" y="120" class="s" text-anchor="middle" font-weight="700">existing is</text>
  <text x="884" y="136" class="s" text-anchor="middle" font-weight="700">what entitles</text>
  <text x="884" y="152" class="s" text-anchor="middle" font-weight="700">the tenant</text>

  <circle class="p" r="6" fill="#1a88b0" style="offset-path: path('M174 59 C 230 59, 230 129, 300 129 L 496 129 C 560 129, 560 59, 620 59')"/>
  <circle class="p p2" r="6" fill="#1a88b0" style="offset-path: path('M174 129 L 620 129')"/>
  <circle class="p p3" r="6" fill="#8a9bac" style="offset-path: path('M174 199 C 230 199, 230 129, 300 129 L 496 129 C 560 129, 560 199, 620 199')"/>
</svg>
