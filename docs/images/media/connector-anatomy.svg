<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="t d">
  <!--
  SPDX-FileCopyrightText: 2026 AOT Technologies
  SPDX-License-Identifier: Apache-2.0
  -->
  <title id="t">Anatomy of a connector</title>
  <desc id="d">A connector package holds schema.py with Pydantic models keyed by an action field, and logic.py with a BaseConnector subclass whose @nw_action methods call the external system. auto_register loads it through the node_wire.connectors entry point, which also registers its error_map. The bindings then expose each action as a REST route, an MCP tool and a gRPC Invoke call.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1c2733; }
    .h { font-size: 13px; font-weight: 700; }
    .s { font-size: 11px; fill: #4a5a6a; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
    .flow { fill: none; stroke-width: 2; stroke-dasharray: 5 6; animation: dash 1.1s linear infinite; }
    .file { animation: lift 6s ease-in-out infinite; }
    .f2 { animation-delay: 1s; } .f3 { animation-delay: 2s; }
    .out { animation: lit 6s ease-in-out infinite; }
    .o2 { animation-delay: .4s; } .o3 { animation-delay: .8s; }
    @keyframes dash { to { stroke-dashoffset: -22; } }
    @keyframes lift { 0%,30%,100% { fill: #fff5f8; } 10%,20% { fill: #fbd0dd; } }
    @keyframes lit { 0%,45%,100% { opacity: .55; } 60%,85% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .flow, .file, .out { animation: none; } .out { opacity: 1; } }
  </style>

  <rect width="960" height="300" rx="16" fill="#ffffff"/>
  <rect x="1" y="1" width="958" height="298" rx="16" fill="none" stroke="#d8dee6"/>

  <!-- Package -->
  <rect x="24" y="24" width="360" height="252" rx="14" fill="#fff5f8" stroke="#b81548" stroke-dasharray="6 5"/>
  <text x="44" y="50" class="mono" font-weight="700" fill="#3d0a1d">src/node_wire_&lt;id&gt;/</text>

  <rect class="file" x="44" y="66" width="320" height="78" rx="10" fill="#fff5f8" stroke="#b81548"/>
  <text x="60" y="88" class="h" fill="#3d0a1d">schema.py</text>
  <text x="60" y="108" class="mono" fill="#3d0a1d">class SendInput(BaseModel):</text>
  <text x="60" y="126" class="mono" fill="#3d0a1d" xml:space="preserve">    action: Literal["send"] = "send"</text>

  <rect class="file f2" x="44" y="154" width="320" height="78" rx="10" fill="#fff5f8" stroke="#b81548"/>
  <text x="60" y="176" class="h" fill="#3d0a1d">logic.py</text>
  <text x="60" y="196" class="mono" fill="#3d0a1d">@nw_action("send")</text>
  <text x="60" y="214" class="mono" fill="#3d0a1d">async def send(self, params, *, trace_id)</text>

  <text x="44" y="258" class="s" fill="#3d0a1d">optional: action_spec.py · normalizers.py · error_map</text>

  <!-- Registration -->
  <path class="flow" stroke="#b8860b" d="M384 150 L 440 150"/>
  <rect x="440" y="104" width="200" height="92" rx="12" fill="#fffaf0" stroke="#b8860b" stroke-width="2"/>
  <text x="540" y="130" class="mono" font-weight="700" text-anchor="middle" fill="#3a2c05">auto_register()</text>
  <text x="540" y="150" class="s" text-anchor="middle" fill="#6b5410">entry point node_wire.connectors</text>
  <text x="540" y="166" class="s" text-anchor="middle" fill="#6b5410">registry + scoped error_map</text>
  <text x="540" y="182" class="s" text-anchor="middle" fill="#6b5410">no extra registration code</text>

  <!-- Bindings -->
  <path class="flow" stroke="#1a88b0" d="M640 150 C 680 150, 680 74, 720 74"/>
  <path class="flow" stroke="#1a88b0" d="M640 150 L 720 150"/>
  <path class="flow" stroke="#12867a" d="M640 150 C 680 150, 680 226, 720 226"/>

  <g class="out"><rect x="720" y="50" width="216" height="48" rx="10" fill="#ddf1fb" stroke="#1a88b0"/>
  <text x="738" y="70" class="h" fill="#0d2f3d">REST route</text>
  <text x="738" y="88" class="mono" fill="#0d2f3d">POST /connectors/&lt;id&gt;/send</text></g>
  <g class="out o2"><rect x="720" y="126" width="216" height="48" rx="10" fill="#ddf1fb" stroke="#1a88b0"/>
  <text x="738" y="146" class="h" fill="#0d2f3d">gRPC Invoke</text>
  <text x="738" y="164" class="mono" fill="#0d2f3d">action: "send"</text></g>
  <g class="out o3"><rect x="720" y="202" width="216" height="48" rx="10" fill="#ddf5f0" stroke="#12867a"/>
  <text x="738" y="222" class="h" fill="#0b2f2a">MCP tool</text>
  <text x="738" y="240" class="mono" fill="#0b2f2a">&lt;id&gt;_send</text></g>
</svg>
