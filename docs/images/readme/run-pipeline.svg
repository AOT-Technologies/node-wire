<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="t d">
  <!--
  SPDX-FileCopyrightText: 2026 AOT Technologies
  SPDX-License-Identifier: Apache-2.0
  -->
  <title id="t">The run() pipeline</title>
  <desc id="d">Every action runs through the same steps: tenant pin check, Pydantic validation, the PolicyHook, retries with a circuit breaker, then the connector's internal_execute. A failure at any step goes to the ErrorMapper. Both paths end in one ConnectorResponse. Everything after the tenant check runs inside an OpenTelemetry span.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1c2733; }
    .h { font-size: 13px; font-weight: 700; }
    .s { font-size: 11px; fill: #4a5a6a; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
    .line { fill: none; stroke: #8a9bac; stroke-width: 2; }
    .err { fill: none; stroke: #b81548; stroke-width: 1.6; stroke-dasharray: 4 5; animation: dash 1.4s linear infinite; }
    .ok { offset-path: path('M108 120 L 852 120'); animation: ok 6s cubic-bezier(.4,0,.6,1) infinite; }
    .bad { offset-path: path('M298 120 L 298 236 L 864 236 L 864 142'); animation: bad 6s ease-in-out infinite; animation-delay: 3s; opacity: 0; }
    .step { animation: lit 6s linear infinite; }
    .s1 { animation-delay: .55s; } .s2 { animation-delay: 1.1s; } .s3 { animation-delay: 1.65s; } .s4 { animation-delay: 2.2s; } .s5 { animation-delay: 2.75s; }
    @keyframes dash { to { stroke-dashoffset: -18; } }
    @keyframes ok { 0% { offset-distance: 0%; opacity: 0; } 4% { opacity: 1; } 46% { offset-distance: 100%; opacity: 1; } 50%,100% { offset-distance: 100%; opacity: 0; } }
    @keyframes bad { 0% { offset-distance: 0%; opacity: 0; } 5% { opacity: 1; } 42% { offset-distance: 100%; opacity: 1; } 46%,100% { offset-distance: 100%; opacity: 0; } }
    @keyframes lit { 0%,100% { fill: #fffaf0; } 3%,7% { fill: #fbe3a6; } 12% { fill: #fffaf0; } }
    @media (prefers-reduced-motion: reduce) { .err, .ok, .bad, .step { animation: none; } .bad { opacity: 1; } }
  </style>

  <rect width="960" height="300" rx="16" fill="#ffffff"/>
  <rect x="1" y="1" width="958" height="298" rx="16" fill="none" stroke="#d8dee6"/>

  <!-- OpenTelemetry span bracket -->
  <rect x="236" y="60" width="580" height="208" rx="12" fill="none" stroke="#5b7387" stroke-dasharray="6 5"/>
  <text x="252" y="80" class="s" font-weight="700" fill="#5b7387">OpenTelemetry span · trace_id on every response</text>

  <path class="line" d="M108 120 L 852 120"/>

  <!-- Input -->
  <rect x="24" y="100" width="88" height="40" rx="20" fill="#eceff3" stroke="#5b7387"/>
  <text x="68" y="125" class="mono" text-anchor="middle">run()</text>

  <!-- Steps -->
  <rect class="step s1" x="132" y="96" width="92" height="48" rx="10" fill="#fffaf0" stroke="#b8860b"/>
  <text x="178" y="117" class="h" text-anchor="middle">Tenant</text>
  <text x="178" y="133" class="s" text-anchor="middle">pin check</text>

  <rect class="step s2" x="250" y="96" width="96" height="48" rx="10" fill="#fffaf0" stroke="#b8860b"/>
  <text x="298" y="117" class="h" text-anchor="middle">Validate</text>
  <text x="298" y="133" class="s" text-anchor="middle">Pydantic union</text>

  <rect class="step s3" x="370" y="96" width="96" height="48" rx="10" fill="#fffaf0" stroke="#b8860b"/>
  <text x="418" y="117" class="h" text-anchor="middle">Policy</text>
  <text x="418" y="133" class="s" text-anchor="middle">PolicyHook</text>

  <rect class="step s4" x="490" y="96" width="120" height="48" rx="10" fill="#fffaf0" stroke="#b8860b"/>
  <text x="550" y="117" class="h" text-anchor="middle">Resilience</text>
  <text x="550" y="133" class="s" text-anchor="middle">retries · breaker</text>

  <rect class="step s5" x="634" y="96" width="120" height="48" rx="10" fill="#fde2ea" stroke="#b81548"/>
  <text x="694" y="117" class="h" text-anchor="middle" fill="#3d0a1d">Execute</text>
  <text x="694" y="133" class="s" text-anchor="middle" fill="#3d0a1d">your connector</text>

  <!-- Output -->
  <rect x="790" y="98" width="148" height="44" rx="22" fill="#ddf5f0" stroke="#12867a"/>
  <text x="864" y="125" class="mono" text-anchor="middle" fill="#0b2f2a">ConnectorResponse</text>

  <!-- Error branch -->
  <path class="err" d="M178 144 L 178 236"/>
  <path class="err" d="M298 144 L 298 236"/>
  <path class="err" d="M418 144 L 418 236"/>
  <path class="err" d="M550 144 L 550 236"/>
  <path class="err" d="M694 144 L 694 236"/>
  <rect x="160" y="216" width="600" height="40" rx="10" fill="#fde2ea" stroke="#b81548"/>
  <text x="460" y="236" class="h" text-anchor="middle" fill="#3d0a1d">ErrorMapper</text>
  <text x="460" y="250" class="s" text-anchor="middle" fill="#3d0a1d">stable error_code + RETRYABLE · BUSINESS · AUTH · FATAL</text>
  <path class="err" d="M760 236 L 864 236 L 864 142"/>

  <circle class="ok" r="7" fill="#12867a"/>
  <circle class="bad" r="7" fill="#b81548"/>

  <text x="480" y="36" class="h" text-anchor="middle" font-size="15">Every action, every transport, the same pipeline</text>
</svg>
