# Edit select/exclude, then run: nw expose resolve. The runtime reads only `actions`.
connector: github
connector_version: 1.1.1
profile: github-branches
select:
- path:/repos/{owner}/{repo}/branches/**
- path:/repos/{owner}/{repo}/git/ref/**
- path:/repos/{owner}/{repo}/git/refs/**
- path:/repos/{owner}/{repo}/git/matching-refs/**
- pulls_update_branch
exclude:
- path:/repos/{owner}/{repo}/branches/*/protection/**
actions:
- git_create_ref
- git_delete_ref
- git_get_ref
- git_list_matching_refs
- git_update_ref
- pulls_update_branch
- repos_get_branch
- repos_list_branches
- repos_rename_branch
