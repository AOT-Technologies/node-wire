# Edit select/exclude, then run: nw expose resolve. The runtime reads only `actions`.
connector: salesforce
connector_version: 1.1.2
profile: salesforce-records
select:
- name:*_record*
- name:*_records
- name:query*
- name:search
- name:describe_*
- name:get_limits
- name:*_lead
- name:*_contact
exclude:
- name:delete_records
- name:*password*
- name:get_ingest_*
- name:*_for_record
- name:*_for_record_type
- name:create_record_with_quick_action
actions:
- create_contact
- create_lead
- create_record
- create_record_tree
- create_records
- delete_contact
- delete_lead
- delete_record
- delete_record_by_external_id
- delete_related_record
- describe_global
- describe_list_view
- describe_sobject
- describe_sobject_quick_action
- get_deleted_records
- get_limits
- get_record
- get_record_by_external_id
- get_record_counts
- get_records
- get_records_with_body
- get_related_records
- get_updated_records
- query
- query_all
- query_all_more
- query_more
- read_contact
- read_lead
- search
- update_contact
- update_lead
- update_record
- update_records
- update_related_record
- upsert_record_by_external_id
- upsert_records
