# Edit select/exclude, then run: nw expose resolve. The runtime reads only `actions`.
connector: salesforce
connector_version: 1.1.2
profile: salesforce-leads-contacts
select:
- name:*_lead
- name:*_contact
actions:
- create_contact
- create_lead
- delete_contact
- delete_lead
- read_contact
- read_lead
- update_contact
- update_lead
