[project]
name = "mcp-template-py"
version = "0.1.0"
description = "Python MCP server template."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=46.0.7",  # CVE-2026-39892 - transitive dep via mcp->pyjwt[crypto]
    "fastapi>=0.136.1",
    "mcp>=1.27.0",
    "pydantic>=2.13.2",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",  # CVE-2026-28684 - transitive dep via pydantic-settings
    "python-multipart>=0.0.27",  # GHSA-pp6c-gr5w-3c5g - transitive dep via fastapi and mcp
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.9",
    "ty>=0.0.31",
    "pytest-cov>=7.1.0",
]
security = [
    "bandit[toml]>=1.9.4",
    "pip-audit>=2.10.0",
    "cyclonedx-bom>=7.3.0",
    "lxml>=6.1.0",  # CVE-2026-41066 - transitive dep via cyclonedx-bom
    "pip>=26.1",  # GHSA-jp4c-xjxw-mgf9 - transitive dep via pip-audit->pip-api
    "urllib3>=2.7.0",  # GHSA-mf9v-mfxr-j63j, GHSA-qccp-gfcp-xxvc - transitive dep via pip-audit->cachecontrol->requests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
addopts = "--cov=mcp_template_py --cov-report html"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
