version: "1"

server:
  name: slack-web
  description: "Send messages to Slack channels using a bot token"

spec:
  source: "/Users/aot/Development/AOT/vinaayakh-node-wire/nw-stacklok-builder/specs/slack_web.openapi.json"
  format: openapi3
  base_url: "https://slack.com/api"
  total_endpoints: 174
  scoped_endpoints: 10

workflows:
  - "Send messages to a channel (using bot token)"

groups:
  - name: messaging
    description: "Post, update, delete, and schedule messages"
    tools:
      - tool_name: post_message
        endpoint: POST /chat.postMessage
        description: >
          Send a message to a channel, group, or user. Returns the message timestamp and full message object. Supports rich formatting via blocks, attachments, and plain text. Use this as the primary method for sending bot messages to channels.
        response_kind: json
        parameters:
          - name: channel
            description: "Channel, private group, or IM channel to send message to. Can be an encoded ID, or a name."
            required: true
            location: body
          - name: text
            description: "Message text. Required if blocks and attachments are not provided. Supports Slack markup formatting."
            required: false
            location: body
          - name: blocks
            description: "A JSON-based array of structured blocks for rich message formatting, presented as a URL-encoded string."
            required: false
            location: body
          - name: attachments
            description: "A JSON-based array of structured attachments for legacy rich formatting, presented as a URL-encoded string."
            required: false
            location: body
          - name: thread_ts
            description: "Timestamp of parent message to make this a threaded reply. Use the parent message's ts, not a reply's ts."
            required: false
            location: body
          - name: reply_broadcast
            description: "Set to true to make threaded reply visible to the entire channel. Defaults to false."
            required: false
            location: body
          - name: as_user
            description: "Pass true to post as the authed user instead of as a bot. Defaults to false."
            required: false
            location: body
          - name: parse
            description: "Set to \"full\" to enable user/channel link parsing. Defaults to \"none\"."
            required: false
            location: body
          - name: link_names
            description: "Set to true to find and link channel names and usernames."
            required: false
            location: body
          - name: mrkdwn
            description: "Set to false to disable Slack markup parsing. Defaults to true."
            required: false
            location: body
          - name: unfurl_links
            description: "Set to true to enable unfurling of text-based content (URLs)."
            required: false
            location: body
          - name: unfurl_media
            description: "Set to false to disable unfurling of media content."
            required: false
            location: body
          - name: icon_url
            description: "URL to image for bot avatar. Only used when as_user is false."
            required: false
            location: body
          - name: icon_emoji
            description: "Emoji to use as bot avatar. Only used when as_user is false. Overrides icon_url."
            required: false
            location: body
          - name: username
            description: "Custom bot username. Only used when as_user is false."
            required: false
            location: body
        hints:
          - "Supports blocks (block-kit) or attachments but not both in a single message"
          - "Responses include message object with bot_id, ts, and type fields for tracking sent messages"

      - tool_name: delete_message
        endpoint: POST /chat.delete
        description: >
          Delete a message previously sent to a channel. Requires the message timestamp and channel ID. Supports deletion by the message author or with appropriate scope.
        response_kind: json
        parameters:
          - name: channel
            description: "Channel containing the message to be deleted. While marked optional in spec, this is required in practice."
            required: false
            location: body
          - name: ts
            description: "Timestamp of the message to be deleted. While marked optional in spec, this is required in practice."
            required: false
            location: body
          - name: as_user
            description: "Pass true to delete as authed user with chat:write:user scope. Defaults to false (use chat:write:bot scope)."
            required: false
            location: body
        hints:
          - "Message timestamps are available in the response from post_message and can be used here"
          - "Only the message author or a user with appropriate permissions can delete messages"

      - tool_name: update_message
        endpoint: POST /chat.update
        description: >
          Update the text or formatting of an existing message. Requires the message timestamp and channel ID. Supports updating blocks, attachments, and text content.
        response_kind: json
        parameters:
          - name: channel
            description: "Channel containing the message to be updated."
            required: true
            location: body
          - name: ts
            description: "Timestamp of the message to be updated."
            required: true
            location: body
          - name: text
            description: "New message text. Not required if updating blocks or attachments."
            required: false
            location: body
          - name: blocks
            description: "New structured blocks for the message, presented as a URL-encoded string. Leave empty to remove previous blocks."
            required: false
            location: body
          - name: attachments
            description: "New structured attachments, presented as a URL-encoded string. Leave empty to remove previous attachments."
            required: false
            location: body
          - name: parse
            description: "Change parsing behavior. Defaults to \"client\". Accepts \"none\" or \"full\"."
            required: false
            location: body
          - name: link_names
            description: "Find and link channel names and usernames."
            required: false
            location: body
          - name: as_user
            description: "Pass true to update as the authed user."
            required: false
            location: body
        hints:
          - "To remove all blocks/attachments, pass an empty array string for those fields"
          - "Updated messages retain original timestamp (ts) but get new message.edited.ts"

      - tool_name: share_me_message
        endpoint: POST /chat.meMessage
        description: >
          Share a "me message" (first-person action message, like "/me is working") to a channel. Returns the message timestamp and object. Useful for status updates and action descriptions.
        response_kind: json
        parameters:
          - name: channel
            description: "Channel, private group or IM channel to send message to. Can be an encoded ID or name. Required in practice."
            required: false
            location: body
          - name: text
            description: "Text of the action message. Will be displayed as \"_botname text_\". Required in practice."
            required: false
            location: body
        hints:
          - "Me messages are automatically italicized and prefixed with the bot name"
          - "Cannot use blocks or attachments with me messages; text only"

      - tool_name: post_ephemeral_message
        endpoint: POST /chat.postEphemeral
        description: >
          Send an ephemeral (temporary) message visible only to a specific user in a channel. Message disappears when the user reloads. Use for private alerts, confirmations, or per-user notifications.
        response_kind: json
        parameters:
          - name: channel
            description: "Channel where the message will appear."
            required: true
            location: body
          - name: user
            description: "ID of the user who will see the ephemeral message. Must be in the specified channel."
            required: true
            location: body
          - name: text
            description: "Message text. Required if blocks and attachments are not provided."
            required: false
            location: body
          - name: blocks
            description: "Structured blocks for rich formatting, presented as a URL-encoded string."
            required: false
            location: body
          - name: attachments
            description: "Structured attachments for legacy formatting, presented as a URL-encoded string."
            required: false
            location: body
          - name: thread_ts
            description: "Timestamp to post in a thread. Message only shows if thread is already active."
            required: false
            location: body
          - name: as_user
            description: "Post as authed user instead of bot. Defaults based on scopes."
            required: false
            location: body
          - name: link_names
            description: "Find and link channel names and usernames."
            required: false
            location: body
          - name: icon_url
            description: "Bot avatar URL. Only when as_user is false."
            required: false
            location: body
          - name: icon_emoji
            description: "Bot avatar emoji. Only when as_user is false."
            required: false
            location: body
          - name: parse
            description: "Parsing behavior for links/usernames."
            required: false
            location: body
          - name: username
            description: "Custom bot name. Only when as_user is false."
            required: false
            location: body
        hints:
          - "Ephemeral messages are visible only to the specified user and disappear on page reload"
          - "Cannot be searched or appear in message history; useful for temporary notifications"

      - tool_name: schedule_message
        endpoint: POST /chat.scheduleMessage
        description: >
          Schedule a message to be sent to a channel at a specific future time. Returns a scheduled_message_id that can be used to cancel before the scheduled time.
        response_kind: json
        parameters:
          - name: channel
            description: "Channel to send the scheduled message to. Can be an encoded ID or name. Required in practice."
            required: false
            location: body
          - name: post_at
            description: "Unix EPOCH timestamp of when to send the message. Required in practice."
            required: false
            location: body
          - name: text
            description: "Message text. Required if blocks and attachments are not provided."
            required: false
            location: body
          - name: blocks
            description: "Structured blocks, presented as a URL-encoded string."
            required: false
            location: body
          - name: attachments
            description: "Structured attachments, presented as a URL-encoded string."
            required: false
            location: body
          - name: thread_ts
            description: "Parent message timestamp for threading."
            required: false
            location: body
          - name: reply_broadcast
            description: "Make threaded reply visible to entire channel."
            required: false
            location: body
          - name: parse
            description: "Enable link/username parsing."
            required: false
            location: body
          - name: link_names
            description: "Find and link usernames and channels."
            required: false
            location: body
          - name: as_user
            description: "Post as authed user instead of bot."
            required: false
            location: body
          - name: unfurl_links
            description: "Enable unfurling of text content."
            required: false
            location: body
          - name: unfurl_media
            description: "Disable unfurling of media content."
            required: false
            location: body
        hints:
          - "Returns scheduled_message_id to use with delete_scheduled_message or retrieve via list_scheduled_messages"
          - "post_at must be a future Unix timestamp; cannot schedule messages in the past"
          - "Scheduled messages may fail silently if channel is deleted or user permissions change before delivery"

      - tool_name: delete_scheduled_message
        endpoint: POST /chat.deleteScheduledMessage
        description: >
          Cancel a scheduled message before it is sent. Requires the scheduled_message_id from schedule_message and the channel where it was scheduled.
        response_kind: json
        parameters:
          - name: channel
            description: "Channel where the scheduled message was queued."
            required: true
            location: body
          - name: scheduled_message_id
            description: "ID returned from schedule_message call."
            required: true
            location: body
          - name: as_user
            description: "Pass true to delete with chat:write:user scope. Defaults to false (chat:write:bot)."
            required: false
            location: body
        hints:
          - "Can only delete messages that have not yet been sent; once a scheduled message is delivered, use delete_message"
          - "No error if message was already sent; operation is idempotent"

      - tool_name: list_scheduled_messages
        endpoint: GET /chat.scheduledMessages.list
        description: >
          Retrieve a list of all scheduled messages for a channel or workspace. Supports filtering by time range and pagination.
        response_kind: json
        parameters:
          - name: channel
            description: "Filter to a specific channel. If omitted, lists all workspace scheduled messages."
            required: false
            location: query
          - name: oldest
            description: "Return messages scheduled after this Unix timestamp (exclusive)."
            required: false
            location: query
          - name: latest
            description: "Return messages scheduled before this Unix timestamp (exclusive)."
            required: false
            location: query
          - name: limit
            description: "Maximum number of items to return. Default is typically 100."
            required: false
            location: query
          - name: cursor
            description: "Pagination cursor from previous response's response_metadata.next_cursor."
            required: false
            location: query
        hints:
          - "paginated: uses cursor-based pagination with next_cursor in response_metadata"
          - "Results include scheduled_message_id, text/blocks, post_at, and channel for each scheduled message"
          - "If channel is omitted, requires broader workspace permissions"

      - tool_name: get_message_permalink
        endpoint: GET /chat.getPermalink
        description: >
          Get the permanent public URL for a message. Useful for sharing message links or creating message references.
        response_kind: json
        parameters:
          - name: channel
            description: "Channel containing the message."
            required: true
            location: query
          - name: message_ts
            description: "Timestamp of the message."
            required: true
            location: query
        hints:
          - "Returns permalink and channel_id in response"
          - "Permalink format is like: https://workspace.slack.com/archives/C1234567890/p1503435956000247"

      - tool_name: unfurl_message
        endpoint: POST /chat.unfurl
        description: >
          Provide custom unfurl behavior for URLs in messages. Intercept and customize how Slack displays links posted by users. Used for integrating third-party content previews.
        response_kind: json
        parameters:
          - name: channel
            description: "Channel ID of the message containing the URLs."
            required: true
            location: body
          - name: ts
            description: "Timestamp of the message to attach unfurls to."
            required: true
            location: body
          - name: unfurls
            description: "URL-encoded JSON map with URLs as keys and their unfurl blocks/attachments as values."
            required: true
            location: body
          - name: user_auth_required
            description: "Set to true if user must authenticate with your app to enable unfurling."
            required: false
            location: body
          - name: user_auth_url
            description: "URL where users complete authentication. Should be properly URL-encoded."
            required: false
            location: body
          - name: user_auth_message
            description: "Ephemeral message text inviting user to authenticate."
            required: false
            location: body
        hints:
          - "Unfurls must be provided as URL-encoded JSON strings"
          - "Requires chat:write scope to modify existing user messages"
          - "User authentication flow shows ephemeral messages and authentication prompt to user"

auth:
  type: oauth2
  flow: authorizationCode
  authorization_url: "https://slack.com/oauth/authorize"
  token_url: "https://slack.com/api/oauth.access"
  scopes_available:
    "admin": "admin"
    "admin.apps:read": "admin.apps:read"
    "admin.apps:write": "admin.apps:write"
    "admin.conversations:read": "admin.conversations:read"
    "admin.conversations:write": "admin.conversations:write"
    "admin.invites:read": "admin.invites:read"
    "admin.invites:write": "admin.invites:write"
    "admin.teams:read": "admin.teams:read"
    "admin.teams:write": "admin.teams:write"
    "admin.usergroups:read": "admin.usergroups:read"
    "admin.usergroups:write": "admin.usergroups:write"
    "admin.users:read": "admin.users:read"
    "admin.users:write": "admin.users:write"
    "authorizations:read": "authorizations:read"
    "bot": "Bot user scope"
    "calls:read": "calls:read"
    "calls:write": "calls:write"
    "channels:history": "channels:history"
    "channels:manage": "channels:manage"
    "channels:read": "channels:read"
    "channels:write": "channels:write"
    "chat:write": "chat:write"
    "chat:write:bot": "Author messages as a bot"
    "chat:write:user": "Author messages as a user"
    "conversations:history": "conversations:history"
    "conversations:read": "conversations:read"
    "conversations:write": "conversations:write"
    "dnd:read": "dnd:read"
    "dnd:write": "dnd:write"
    "emoji:read": "emoji:read"
    "files:read": "files:read"
    "files:write:user": "files:write:user"
    "groups:history": "groups:history"
    "groups:read": "groups:read"
    "groups:write": "groups:write"
    "identity.basic": "identity.basic"
    "im:history": "im:history"
    "im:read": "im:read"
    "im:write": "im:write"
    "links:write": "links:write"
    "mpim:history": "mpim:history"
    "mpim:read": "mpim:read"
    "mpim:write": "mpim:write"
    "none": "No scope required"
    "pins:read": "pins:read"
    "pins:write": "pins:write"
    "reactions:read": "reactions:read"
    "reactions:write": "reactions:write"
    "reminders:read": "reminders:read"
    "reminders:write": "reminders:write"
    "remote_files:read": "remote_files:read"
    "remote_files:share": "remote_files:share"
    "remote_files:write": "remote_files:write"
    "rtm:stream": "rtm:stream"
    "search:read": "search:read"
    "stars:read": "stars:read"
    "stars:write": "stars:write"
    "team:read": "team:read"
    "tokens.basic": "tokens.basic"
    "usergroups:read": "usergroups:read"
    "usergroups:write": "usergroups:write"
    "users.profile:read": "users.profile:read"
    "users.profile:write": "users.profile:write"
    "users:read": "users:read"
    "users:read.email": "users:read.email"
    "users:write": "users:write"
    "workflow.steps:execute": "workflow.steps:execute"
  scopes_required:
    - chat:write:bot
  notes: >
    OAuth2 authorization code flow for Slack workspace apps. The bot token use case typically requires only chat:write:bot scope for posting messages. Additional scopes like channels:read or users:read may be needed for enhanced functionality (channel/user lookups) but are not minimal for basic message posting.
