version: "1"

server:
  name: slack
  description: "Post messages to Slack channels and threads as a bot, and find, inspect, and join the channels to post in."

spec:
  source: "/Users/aot/Development/AOT/vinaayakh-node-wire/nw-stacklok-builder/specs/slack_web.openapi.json"
  format: openapi3
  base_url: "https://slack.com/api"
  total_endpoints: 174
  scoped_endpoints: 8

workflows:
  - "Users should be able to post messages to a channel"

groups:
  - name: messaging
    description: "Send, edit, and link to messages in Slack channels and threads."
    tools:
      - tool_name: post_message
        endpoint: POST /chat.postMessage
        description: >
          Post a new message visible to everyone in a Slack channel, private channel, or DM, as the bot.
          You can also reply in a thread by passing `thread_ts`. Returns `ok`, the `channel` ID, the new
          message's `ts` (use it later to update, reply to, or get a permalink for the message), and the
          posted `message` object. The bot must be a member of the channel (use `join_conversation` for
          public channels first) or you get `not_in_channel`. To DM a user, get the DM channel ID from
          `open_conversation` first.
        response_kind: json
        parameters:
          - name: channel
            description: "Channel ID (e.g. `C0123456789`), private channel ID, or DM/IM ID to post to. A channel name like `#general` also works, but an ID is more reliable. Use `list_conversations` to find IDs."
            required: true
            location: body
          - name: text
            description: "Message text. Supports Slack mrkdwn (`*bold*`, `_italic_`, `<@U123>` user mentions, `<#C123>` channel links). Required unless `blocks` or `attachments` is given. When `blocks` is given, `text` is the notification/fallback text, so always include it."
            required: false
            location: body
          - name: blocks
            description: "Block Kit layout as a JSON array string, e.g. `[{\"type\":\"section\",\"text\":{\"type\":\"mrkdwn\",\"text\":\"Hello\"}}]`. Use it for rich formatting. Maximum 50 blocks."
            required: false
            location: body
          - name: attachments
            description: "Legacy secondary attachments as a JSON array string. Prefer `blocks` for new messages."
            required: false
            location: body
          - name: thread_ts
            description: "`ts` of the parent message to reply in its thread. Always use the parent's `ts`, never a reply's `ts`."
            required: false
            location: body
          - name: reply_broadcast
            description: "With `thread_ts`, set to true to also show the reply in the main channel. Default false."
            required: false
            location: body
          - name: mrkdwn
            description: "Set to false to disable Slack markup parsing of `text`. Default true."
            required: false
            location: body
          - name: link_names
            description: "Set to true to turn plain `@username` / `#channel` text into real mentions/links."
            required: false
            location: body
          - name: unfurl_links
            description: "Set to true to unfurl primarily text-based links (e.g. article previews)."
            required: false
            location: body
          - name: unfurl_media
            description: "Set to false to disable media unfurls (images, video). Default true."
            required: false
            location: body
          - name: username
            description: "Override the bot's display name for this message. Requires the `chat:write.customize` scope."
            required: false
            location: body
          - name: icon_emoji
            description: "Emoji to use as the bot's icon for this message, e.g. `:robot_face:`. Overrides `icon_url`. Requires `chat:write.customize`."
            required: false
            location: body
          - name: icon_url
            description: "Image URL to use as the bot's icon for this message. Requires `chat:write.customize`."
            required: false
            location: body
        hints:
          - "channel must be a channel ID for reliability; resolve names with list_conversations first"
          - "bot must be a member of the channel or the call fails with not_in_channel — call join_conversation (public channels) or ask a human to invite the bot (private channels)"
          - "blocks and attachments are JSON strings (form-urlencoded body), not nested objects — serialize before sending"
          - "Slack returns HTTP 200 with ok=false on errors; check the `ok` and `error` fields"
          - "rate limited to roughly 1 message per second per channel"
          - "the returned ts identifies the message; keep it for update_message, get_message_permalink, and thread replies"

      - tool_name: update_message
        endpoint: POST /chat.update
        description: >
          Edit the text, blocks, or attachments of an existing message the bot posted, identified by
          `channel` + `ts`. Returns `ok`, `channel`, `ts`, and the updated `text`/`message`. Fields you
          leave out: `blocks` and `attachments` keep their previous values (pass `[]` to clear them).
          Ephemeral messages cannot be updated.
        response_kind: json
        parameters:
          - name: channel
            description: "Channel ID containing the message to update."
            required: true
            location: body
          - name: ts
            description: "`ts` of the message to update, exactly as returned by `post_message` (a string like `1712345678.123456`)."
            required: true
            location: body
          - name: text
            description: "New message text in Slack mrkdwn. Not required when `blocks` or `attachments` is given."
            required: false
            location: body
          - name: blocks
            description: "New Block Kit layout as a JSON array string. If omitted, the existing blocks are kept. Pass `[]` to remove them."
            required: false
            location: body
          - name: attachments
            description: "New legacy attachments as a JSON array string. If omitted, the existing attachments are kept. Pass `[]` to remove them."
            required: false
            location: body
          - name: link_names
            description: "Set to true to turn plain `@username` / `#channel` text into mentions. If omitted, the message's original setting is reset to the default (`none`)."
            required: false
            location: body
        hints:
          - "bot tokens can only update messages posted by the same bot (otherwise cant_update_message)"
          - "Slack returns HTTP 200 with ok=false on errors (e.g. message_not_found)"

      - tool_name: get_message_permalink
        endpoint: GET /chat.getPermalink
        description: >
          Get a shareable permalink URL for an existing message, identified by `channel` + `message_ts`.
          Returns `ok`, `channel`, and `permalink` (e.g. `https://team.slack.com/archives/C123/p1712345678123456`).
        response_kind: json
        parameters:
          - name: channel
            description: "ID of the channel containing the message."
            required: true
            location: query
          - name: message_ts
            description: "The message's `ts` value, exactly as returned when it was posted."
            required: true
            location: query

  - name: conversations
    description: "Find, inspect, and join channels and DMs, and read threads, so the bot can post in the right place."
    tools:
      - tool_name: list_conversations
        endpoint: GET /conversations.list
        description: >
          List channels in the workspace (public by default; also private channels the bot is in, group
          DMs, and DMs via `types`). Returns `channels` (each with `id`, `name`, `is_private`,
          `is_archived`, `is_member`, `topic`, `purpose`) and `response_metadata.next_cursor`. Use this to
          turn a channel name into the channel ID other tools need, and to check `is_member` before posting.
        response_kind: json
        parameters:
          - name: types
            description: "Comma-separated channel types to include: any of `public_channel`, `private_channel`, `mpim`, `im`. Default `public_channel`."
            required: false
            location: query
          - name: exclude_archived
            description: "Set to true to leave out archived channels. Default false."
            required: false
            location: query
          - name: limit
            description: "Maximum channels per page, up to 1000. Default 100. Slack recommends 200 or less."
            required: false
            location: query
          - name: cursor
            description: "Pagination cursor from a previous call's `response_metadata.next_cursor`. Omit it for the first page."
            required: false
            location: query
        hints:
          - "paginated: uses cursor / response_metadata.next_cursor pattern (empty next_cursor means last page); a name lookup may need several pages"
          - "fewer than limit results may be returned even when more pages exist; always check next_cursor"
          - "private channels only appear if the bot is a member"
          - "response is large for big workspaces — use exclude_archived=true and narrow types"

      - tool_name: get_conversation_info
        endpoint: GET /conversations.info
        description: >
          Get details for one channel or DM by ID: `name`, `is_private`, `is_archived`, `is_member`,
          `topic`, `purpose`, `created`, and optionally member count and locale. Use it to check that a
          channel exists and that the bot is a member before posting.
        response_kind: json
        parameters:
          - name: channel
            description: "Channel/conversation ID to look up. Required by Slack in practice."
            required: false
            location: query
          - name: include_num_members
            description: "Set to true to include `num_members`. Default false."
            required: false
            location: query
          - name: include_locale
            description: "Set to true to include the conversation's `locale`. Default false."
            required: false
            location: query
        hints:
          - "returns channel_not_found for private channels the bot is not in"

      - tool_name: join_conversation
        endpoint: POST /conversations.join
        description: >
          Add the bot to an existing public channel so it can post and read there. Returns `ok` and the
          `channel` object. It does not work for private channels or DMs; a member must invite the bot to
          those. Use it before `post_message` when `is_member` is false or posting fails with `not_in_channel`.
        response_kind: json
        parameters:
          - name: channel
            description: "ID of the public channel to join. Required by Slack in practice."
            required: false
            location: body
        hints:
          - "bot token needs the channels:join scope (spec lists legacy channels:write); public channels only"
          - "idempotent — joining a channel already joined returns ok with a warning already_in_channel"

      - tool_name: get_thread_replies
        endpoint: GET /conversations.replies
        description: >
          Get a message thread: the parent message plus all its replies, identified by `channel` + the
          parent's `ts`. Returns `messages` (the parent first, then replies in order), `has_more`, and
          `response_metadata.next_cursor`. Use it to read a discussion before replying with
          `post_message` + `thread_ts`.
        response_kind: json
        parameters:
          - name: channel
            description: "Channel ID containing the thread. Required by Slack in practice."
            required: false
            location: query
          - name: ts
            description: "`ts` of the thread's parent message. If the message has no replies, only that message is returned. Required by Slack in practice."
            required: false
            location: query
          - name: oldest
            description: "Only replies after this Slack timestamp."
            required: false
            location: query
          - name: latest
            description: "Only replies before this Slack timestamp."
            required: false
            location: query
          - name: inclusive
            description: "Set to true to include messages exactly at `oldest`/`latest`."
            required: false
            location: query
          - name: limit
            description: "Maximum messages per page. Default 1000. Slack recommends 200 or less."
            required: false
            location: query
          - name: cursor
            description: "Pagination cursor from a previous call's `response_metadata.next_cursor`."
            required: false
            location: query
        hints:
          - "paginated: uses cursor / response_metadata.next_cursor pattern"
          - "spec types ts/oldest/latest as number; pass the exact string ts or the thread lookup can fail"
          - "heavily rate limited for non-Marketplace apps (as low as 1 request/minute)"

      - tool_name: open_conversation
        endpoint: POST /conversations.open
        description: >
          Open (or resume) a direct message with one user, or a group DM with several users, and return
          its channel ID. Pass that ID as `channel` to `post_message` to DM someone. Returns `ok` and
          `channel` (with `id`).
        response_kind: json
        parameters:
          - name: users
            description: "Comma-separated user IDs, e.g. `U0123,U0456`. One ID opens a 1:1 DM; 2–8 IDs open a group DM. Give either `users` or `channel`."
            required: false
            location: body
          - name: channel
            description: "ID of an existing IM/MPIM to resume, instead of `users`."
            required: false
            location: body
          - name: return_im
            description: "Set to true to get the full IM channel object in the response."
            required: false
            location: body
        hints:
          - "requires im:write / mpim:write bot scopes"
          - "exactly one of users or channel must be given"

auth:
  type: api_key
  notes: >
    Static Slack bot token (xoxb-) sent as Authorization: Bearer, supplied at deploy time
    (e.g. thv --remote-auth-bearer-token). The Slack app needs these bot scopes: chat:write,
    channels:read, groups:read, im:read, mpim:read, channels:join, channels:history,
    groups:history, im:history, mpim:history, im:write, mpim:write (optional:
    chat:write.customize for username/icon overrides). The spec declares only a legacy
    oauth2 authorizationCode scheme (slackAuth: https://slack.com/oauth/authorize,
    https://slack.com/api/oauth.access), rejected in favor of the static bot token. The
    spec's per-endpoint `token` header/query param is dropped by the connector builder
    as a credential param.
