[project]
name = "nw-stacklok-builder"
version = "0.1.0"
description = "stacklok mcp-builder (vendored) generating MCP servers on the node-wire runtime and connectors"
requires-python = ">=3.13"
dependencies = [
    # stacklok/mcp-builder's own runtime dependencies (upstream pyproject.toml @ 7c03c38).
    "jinja2>=3.1.6",
    "openapi-pydantic>=0.5.1",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "structlog>=25.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_builder", "src/nw_stacklok"]
