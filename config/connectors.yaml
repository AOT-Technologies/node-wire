# connectors.yaml — Node Wire connector configuration
#
# REST API auth (not stored here; set in environment):
#   NW_REST_API_KEY — required for /connectors, /playground, /scenarios unless NW_REST_AUTH_DISABLED=true
#
# SECURITY RULE: This file must never contain secrets.
#   - Non-sensitive config (base_url, host, port) → safe in YAML
#   - Secrets (client_id, private_key, api_key) → environment variables (or cloud backend)
#
connectors:
  http_generic:
    enabled: true
    exposed_via: ["rest", "grpc", "mcp"]
    # auth: not set — defaults to NoAuthProvider

  smtp:
    enabled: true
    exposed_via: ["rest", "grpc", "mcp"]
    host: "smtp.example.com"
    port: 587
    from_email: "noreply@example.com"
    auth:
      provider: static_credentials
      username_secret: SMTP_USERNAME
      password_secret: SMTP_PASSWORD

  stripe:
    enabled: true
    exposed_via: ["rest", "grpc", "mcp"]  # keeping REST unless you explicitly want to remove it
    auth:
      provider: static_token
      secret_key: STRIPE_BASIC_AUTH
      prefix: Basic
      encoding: base64  # value is "<secret key>:"

  google_drive:
    enabled: true
    exposed_via: ["rest", "grpc", "mcp"]
    auth:
      provider: service_account
      sa_json_secret: GOOGLE_DRIVE_SA_JSON  # the service-account key: its JSON text, or a path to the file
      scopes:
      - https://www.googleapis.com/auth/drive
    # For a plain OAuth2 access token instead, use: provider: static_token, secret_key: GOOGLE_DRIVE_ACCESS_TOKEN
    # OIDC / per-user Drive (ToolHive upstream bearer passthrough) — credential
    # relay, a trust-boundary decision: Node Wire forwards the caller's own inbound
    # token to Google Drive's API as-is, verifying nothing about whether that token
    # is actually valid for Drive (audience binding is the host's responsibility).
    # Requires BOTH of the following — neither alone is sufficient, this fails
    # closed otherwise:
    #   1. auth: { provider: upstream_bearer }   (or GOOGLE_DRIVE_AUTH_PROVIDER=upstream_bearer)
    #   2. NW_UPSTREAM_BEARER_CONNECTORS=google_drive   (see sample.env)
    # auth:
    #   provider: upstream_bearer

  fhir_epic:
    enabled: true
    exposed_via: ["rest", "grpc", "mcp"]
    auth:
      provider: oauth2
      grant_method: private_key_jwt
      token_url_secret: EPIC_TOKEN_URL
      client_id_secret: EPIC_CLIENT_ID
      private_key_secret: EPIC_PRIVATE_KEY
      kid_secret: EPIC_KID
      algorithm: RS384

  fhir_cerner:
    enabled: true
    exposed_via: ["rest", "grpc", "mcp"]
    auth:
      provider: oauth2
      grant_method: private_key_jwt
      token_url_secret: CERNER_TOKEN_URL
      client_id_secret: CERNER_CLIENT_ID
      private_key_secret: CERNER_PRIVATE_KEY
      kid_secret: CERNER_KID
      algorithm: RS384
      scopes_secret: CERNER_SCOPES
      scopes:
      - system/Patient.read
      - system/Encounter.read
      - system/DocumentReference.read
      - system/DocumentReference.write

  salesforce:
    enabled: false  # opt-in: 150 actions, including password resets and bulk deletes; see expose/salesforce/
    exposed_via: ["rest"]  # add grpc/mcp only together with an NW_EXPOSE_PROFILE
    # api_version: v68.0   # optional; v68.0 is the default
    auth:
      provider: oauth2
      grant_method: refresh_token
      token_url_secret: SALESFORCE_TOKEN_URL
      client_id_secret: SALESFORCE_CLIENT_ID
      client_secret_secret: SALESFORCE_CLIENT_SECRET
      refresh_token_secret: SALESFORCE_REFRESH_TOKEN

  slack:
    enabled: true
    exposed_via: ["rest", "grpc", "mcp"]
    auth:
      provider: static_token
      secret_key: SLACK_BOT_TOKEN
  slack_web:
    enabled: true
    exposed_via:
    - rest
    - grpc
    - mcp
    base_url: https://slack.com/api
    auth:
      provider: static_token
      secret_key: SLACK_WEB_ACCESS_TOKEN
      header_name: Authorization
      prefix: Bearer
      host_supplied: true
  github:
    enabled: true
    exposed_via:
    - rest
    - grpc
    - mcp
    base_url: https://api.github.com
    auth:
      provider: static_token
      secret_key: GITHUB_TOKEN
    headers:
      Accept: application/vnd.github+json
      X-GitHub-Api-Version: '2022-11-28'
  slack_api:
    enabled: true
    exposed_via:
    - rest
    - grpc
    - mcp
    base_url: https://slack.com/api
    auth:
      provider: static_token
      secret_key: SLACK_API_ACCESS_TOKEN
      header_name: Authorization
      prefix: Bearer
      host_supplied: true
  n8n:
    enabled: false  # opt-in: the API key grants instance-admin actions (users, credentials, SSO)
    exposed_via: [rest]  # add grpc/mcp only together with an NW_EXPOSE_PROFILE (expose/n8n/)
    instance_url: http://localhost:5678
    auth:
      provider: static_token
      secret_key: N8N_API_KEY
      header_name: X-N8N-API-KEY
      prefix: ''
  postgres:
    enabled: true
    exposed_via: [rest, grpc, mcp]
    host: 127.0.0.1
    port: 55432
    database: nwdb
    sslmode: disable
    mode: read_only           # read_only | read_write | admin (insert needs read_write)
