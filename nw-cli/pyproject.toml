[project]
name = "nw-cli"
version = "0.1.0"
description = "Unified CLI for OpenAPI connector codegen, wheel builds, MCP hosts, and Docker images"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "nw-connector-builder",
    "nw-mcp-builder",
]

[project.scripts]
nw = "nw_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nw_cli"]

[tool.uv.sources]
nw-connector-builder = { path = "../nw-connector-builder", editable = true }
nw-mcp-builder = { path = "../nw-mcp-builder", editable = true }
