name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

# This workflow enforces Bandit SAST on every PR and push to main.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bandit:
    name: Bandit security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install dependencies
        run: uv sync --frozen --extra agents --dev
      # Bandit exits non-zero when *any* finding exists (incl. low/medium).
      # --exit-zero keeps the JSON artifact; the gate below reads that JSON
      # instead of scanning the tree a second time.
      # Scan the connector runtime under src/ plus the nw CLI / builder packages
      # that produce MCP servers — the priority surface for main-branch health.
      - name: Generate Bandit JSON report
        run: >
          uv run bandit -c pyproject.toml
          -r src nw-cli/src nw-mcp-builder/src nw-connector-builder/src
          -f json -o bandit-report.json --exit-zero
      - name: Bandit findings summary (log)
        run: uv run python scripts/bandit_report_summary.py bandit-report.json --sarif-out bandit.sarif
      - name: Upload Bandit report artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: bandit-report
          path: |
            bandit-report.json
            bandit.sarif
          retention-days: 7
          if-no-files-found: error
      # Fork pull requests cannot write security events. Same-repo PRs and
      # pushes upload so findings show on the Security tab.
      - name: Upload Bandit SARIF
        if: >-
          success() &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@8272c299f21ca24af15dfe9ac0971ba969e5e0d5 # v3.36.2
        with:
          sarif_file: bandit.sarif
          category: bandit
      - name: Enforce high-severity Bandit gate
        run: uv run python scripts/bandit_report_summary.py bandit-report.json --fail-on high
