name: CI – Pytest

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Run pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Run pytest
        run: uv run pytest --cov --cov-report=html --cov-report=term-missing

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html-${{ matrix.os }}-py${{ matrix.python-version }}
          path: htmlcov/
          if-no-files-found: ignore


  playground-integration:
    name: Playground integration tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Install Playwright browsers
        run: uv run python -m playwright install chromium --with-deps

      - name: Run playground integration tests
        env:

          #gdrive
          GOOGLE_DRIVE_SA_JSON: ${{ secrets.GOOGLE_DRIVE_SA_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GDRIVE_TEST_RECIPIENT_EMAIL: ${{ secrets.GDRIVE_TEST_RECIPIENT_EMAIL }}
          
          #stripe
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          STRIPE_TEST_CUSTOMER_ID: ${{ secrets.STRIPE_TEST_CUSTOMER_ID }}
          STRIPE_TEST_PRICE_ID: ${{ secrets.STRIPE_TEST_PRICE_ID }}

          #salesforce
          SALESFORCE_INSTANCE_URL: ${{ secrets.SALESFORCE_INSTANCE_URL }}
          SALESFORCE_TOKEN_URL: ${{ secrets.SALESFORCE_TOKEN_URL }}
          SALESFORCE_CLIENT_ID: ${{ secrets.SALESFORCE_CLIENT_ID }}
          SALESFORCE_CLIENT_SECRET: ${{ secrets.SALESFORCE_CLIENT_SECRET }}
          SALESFORCE_REFRESH_TOKEN: ${{ secrets.SALESFORCE_REFRESH_TOKEN }}

          #slack
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_TEST_CHANNEL: ${{ secrets.SLACK_TEST_CHANNEL }}
          SLACK_TEST_USER_ID: ${{ secrets.SLACK_TEST_USER_ID }}
          SLACK_TEST_CHANNEL_ID: ${{ secrets.SLACK_TEST_CHANNEL_ID }}

          #epic fhir
          EPIC_CLIENT_ID: ${{ secrets.EPIC_CLIENT_ID }}
          EPIC_PRIVATE_KEY: ${{ secrets.EPIC_PRIVATE_KEY }}
          EPIC_TOKEN_URL: ${{ secrets.EPIC_TOKEN_URL }}
          EPIC_KID: ${{ secrets.EPIC_KID }}
          EPIC_FHIR_BASE_URL: ${{ secrets.EPIC_FHIR_BASE_URL }}

          #cerner
          CERNER_CLIENT_ID: ${{ secrets.CERNER_CLIENT_ID }}
          CERNER_PRIVATE_KEY: ${{ secrets.CERNER_PRIVATE_KEY }}
          CERNER_TOKEN_URL: ${{ secrets.CERNER_TOKEN_URL }}
          CERNER_KID: ${{ secrets.CERNER_KID }}
          CERNER_FHIR_BASE_URL: ${{ secrets.CERNER_FHIR_BASE_URL }}
          CERNER_SCOPES: ${{ secrets.CERNER_SCOPES }}

          # Disable authentication and dotenv loading for playground tests, and restrict connectors
          NW_REST_AUTH_DISABLED: "true"
          NW_REST_LOAD_DOTENV: "false"
          NW_ALLOWED_CONNECTORS: "google_drive,salesforce,stripe,slack,fhir_epic,fhir_cerner,http_generic"
        run: uv run pytest tests/playground/ --no-cov -v

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
