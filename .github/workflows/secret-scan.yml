name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly — catches newly disclosed patterns against full history.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Workflow expressions have no arithmetic, and the scan below resolves
      # HEAD~<commits>, so the depth has to cover one commit past the branch.
      - name: Compute pull request fetch depth
        id: depth
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: echo "value=$((PR_COMMITS + 1))" >> "$GITHUB_OUTPUT"

      # Pull requests only need the commits on the branch. The weekly cron
      # (and manual runs, and pushes to main) scan full history for patterns
      # added after those commits landed.
      - name: Checkout pull request commits
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: ${{ steps.depth.outputs.value }}

      - name: Checkout repository (full history)
        if: github.event_name != 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Cache Gitleaks binary
        id: cache-gitleaks
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ./gitleaks
          key: gitleaks-v8.27.2-linux-x64

      - name: Download Gitleaks
        if: steps.cache-gitleaks.outputs.cache-hit != 'true'
        env:
          GITLEAKS_SHA256: "141c3b2dede46d8b3a53b47116da756bd223decc0374797559a6b50ecba5590c"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.27.2/gitleaks_8.27.2_linux_x64.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          rm gitleaks.tar.gz

      - name: Run Gitleaks
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          if [[ ! -x ./gitleaks ]]; then
            echo "::error::Gitleaks binary missing or not executable — cache may be corrupt"
            exit 1
          fi
          log_opts=()
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            if git rev-parse --verify --quiet "HEAD~${PR_COMMITS}" >/dev/null; then
              log_opts=(--log-opts "HEAD~${PR_COMMITS}..HEAD")
              echo "Scanning ${PR_COMMITS} pull request commit(s)"
            else
              echo "Pull request range is not in the shallow clone; scanning full history"
              git fetch --no-tags --unshallow
            fi
          else
            echo "Scanning full history"
          fi
          set +e
          ./gitleaks detect --source . --redact --exit-code 1 \
            "${log_opts[@]}" \
            --report-format sarif --report-path gitleaks.sarif
          status=$?
          set -e
          if [[ -f gitleaks.sarif ]]; then
            python3 scripts/ci_step_summary.py sarif gitleaks.sarif --title "Gitleaks"
          fi
          exit "${status}"

      - name: Upload Gitleaks SARIF
        if: >-
          always() &&
          hashFiles('gitleaks.sarif') != '' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@8272c299f21ca24af15dfe9ac0971ba969e5e0d5 # v3.36.2
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
