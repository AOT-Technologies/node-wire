# Enforce baseline container hygiene: digest-pinned base image and non-root USER.
name: Docker policy

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker/**"
      - "nw-mcp-builder/src/nw_mcp_builder/generate/connector_project.py"
      - ".github/workflows/docker-policy.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "docker/**"
      - "nw-mcp-builder/src/nw_mcp_builder/generate/connector_project.py"
      - ".github/workflows/docker-policy.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify Dockerfiles use digest-pinned FROM and non-root USER
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(Dockerfile docker/*/Dockerfile)
          for f in "${files[@]}"; do
            echo "Checking $f"
            if ! grep -qE '^FROM [^[:space:]]+@sha256:[a-f0-9]{64}' "$f"; then
              echo "ERROR: $f must use FROM image@sha256:<64-hex-digest>" >&2
              exit 1
            fi
            if ! grep -qE '^USER[[:space:]]' "$f"; then
              echo "ERROR: $f must include a USER directive" >&2
              exit 1
            fi
            last_user="$(grep -E '^USER[[:space:]]' "$f" | tail -n1)"
            if [[ "${last_user}" =~ ^USER[[:space:]]+(0|root)([[:space:]:]|$) ]]; then
              echo "ERROR: $f final USER must not be root/0 (got: ${last_user})" >&2
              exit 1
            fi
          done
          gen="nw-mcp-builder/src/nw_mcp_builder/generate/connector_project.py"
          echo "Checking generated template $gen"
          if ! grep -qE 'python:3.12-slim@sha256:[a-f0-9]{64}' "$gen"; then
            echo "ERROR: $gen must pin python:3.12-slim@sha256:<64-hex-digest>" >&2
            exit 1
          fi
          echo "PASS: all Dockerfiles pinned and non-root"
