name: Lint and Type Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lockfile-check:
    name: Lockfile freshness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Verify uv.lock matches pyproject.toml
        id: lock
        run: uv lock --check

      - name: Report lockfile check
        if: always()
        run: |
          echo "### Lockfile: ${{ steps.lock.outcome }}" >> "$GITHUB_STEP_SUMMARY"

  ruff:
    name: Ruff Linters
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra agents --dev

      - name: Run Ruff (Linting)
        id: ruff
        # --output-format=github automatically creates inline annotations on your PR code!
        run: uv run ruff check --output-format=github .

      - name: Run Ruff (Formatting Check)
        id: ruff-format
        if: always() && steps.ruff.outcome != 'skipped' && steps.ruff.outcome != 'cancelled'
        run: uv run ruff format --check .

      - name: Run REUSE lint
        id: reuse
        if: always() && steps.ruff.outcome != 'skipped' && steps.ruff.outcome != 'cancelled'
        run: uv run reuse lint

      - name: Report Ruff and REUSE
        if: always()
        run: |
          {
            echo "### Ruff and REUSE"
            echo "- Lint: ${{ steps.ruff.outcome }}"
            echo "- Format: ${{ steps.ruff-format.outcome }}"
            echo "- REUSE: ${{ steps.reuse.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  mypy:
    name: Mypy Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra agents --dev

      - name: Run Mypy (Type checking)
        shell: bash
        run: |
          echo "::add-matcher::.github/matchers/mypy.json"
          set +e
          uv run mypy --show-column-numbers --show-error-codes 2>&1 | tee mypy.txt
          status=${PIPESTATUS[0]}
          set -e
          uv run python scripts/ci_step_summary.py mypy mypy.txt
          summary_status=$?
          if [[ "${status}" -ne 0 ]]; then
            exit "${status}"
          fi
          exit "${summary_status}"
