name: DCO

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off check
    # Bot authors cannot sign off. The job still succeeds so a required check
    # does not stay Skipped.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Classify actor
        id: actor
        env:
          ACTOR: ${{ github.actor }}
        run: |
          case "${ACTOR}" in
            "dependabot[bot]"|"github-actions[bot]"|"renovate[bot]")
              echo "bot=true" >> "$GITHUB_OUTPUT"
              {
                echo "### DCO"
                echo "Bot author ${ACTOR} is exempt from DCO sign-off."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "bot=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.actor.outputs.bot != 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify every commit carries a DCO sign-off
        if: steps.actor.outputs.bot != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Bot email domains used by GitHub-managed bots. Commits authored by
          # these are skipped — bots cannot provide a DCO sign-off.
          BOT_PATTERN="noreply.github.com"

          commits="$(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")"
          if [ -z "${commits}" ]; then
            echo "No non-merge commits to check."
            echo "### DCO" >> "$GITHUB_STEP_SUMMARY"
            echo "No non-merge commits to check." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          status=0
          checked=0
          failed=0
          for sha in ${commits}; do
            subject="$(git show -s --format='%s' "${sha}")"
            author="$(git show -s --format='%an <%ae>' "${sha}")"
            author_email="$(git show -s --format='%ae' "${sha}")"

            if echo "${author_email}" | grep -qF "${BOT_PATTERN}"; then
              echo "SKIP  ${sha:0:12}  ${subject}  (bot commit)"
              continue
            fi

            checked=$((checked + 1))
            if git show -s --format='%B' "${sha}" \
                 | grep -iqF "Signed-off-by: ${author}"; then
              echo "PASS  ${sha:0:12}  ${subject}"
            else
              echo "FAIL  ${sha:0:12}  ${subject}"
              echo "        missing trailer: Signed-off-by: ${author}"
              echo "::error title=DCO::Commit ${sha} is missing a Signed-off-by trailer for its author"
              status=1
              failed=$((failed + 1))
            fi
          done

          {
            echo "### DCO"
            echo "- Commits checked: ${checked}"
            echo "- Missing sign-off: ${failed}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${status}" -ne 0 ]; then
            echo ""
            echo "One or more commits are missing a Developer Certificate of Origin sign-off."
            echo "See https://developercertificate.org/ and CONTRIBUTING.md."
            echo ""
            echo "Sign new commits with:   git commit -s"
            echo "Fix existing commits:    git rebase --signoff ${BASE_SHA} && git push --force-with-lease"
            exit 1
          fi

          echo ""
          echo "All commits are signed off."
