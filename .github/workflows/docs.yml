name: docs

# Pinned like the other workflows (uv --frozen, pip-audit==, cibuildwheel==).
# mkdocs-material warns that MkDocs 2.0 is backward-incompatible, so an unpinned
# install would break or silently change the published site on release day.
env:
  MKDOCS_VERSION: "1.6.1"
  MKDOCS_MATERIAL_VERSION: "9.7.6"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default: the pull-request job never needs to write. The deploy job
# opts in to `contents: write` for itself.
permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  # Supersede stale PR builds, but never cancel a deploy that is mid-push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (dry run)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install docs dependencies
        run: |
          python -m pip install \
            "mkdocs==${MKDOCS_VERSION}" \
            "mkdocs-material==${MKDOCS_MATERIAL_VERSION}"

      # --strict turns dead nav entries, broken links and bad anchors into failures.
      - name: Build site
        run: mkdocs build --strict

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # gh-deploy commits to the gh-pages branch, so it needs real history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install docs dependencies
        run: |
          python -m pip install \
            "mkdocs==${MKDOCS_VERSION}" \
            "mkdocs-material==${MKDOCS_MATERIAL_VERSION}"

      # Same --strict gate as the PR build, so a direct push to main that skipped
      # review cannot publish a site the pull-request job would have rejected.
      - name: Deploy
        run: mkdocs gh-deploy --force --strict
