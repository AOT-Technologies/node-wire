# Pinned action SHAs are immutable; update intentionally when upgrading.
# yamllint disable rule:line-length
name: Publish Node Wire package

# Manual trigger per package. There is no version input — the version is read
# from the selected package's pyproject.toml at the ref you dispatch from
# (branch or tag, chosen in the "Use workflow from" dropdown).
#
#   channel: release — publishes that version as-is (e.g. 1.0.0).
#                      Requires a dated CHANGELOG entry and an existing
#                      GitHub Release tagged v<version>.
#   channel: beta    — publishes a PEP 440 pre-release derived from it
#                      (1.0.0 -> 1.0.0b1, then b2, b3 ...). The next beta
#                      number is resolved from what already exists on PyPI.
#                      No changelog entry or GitHub Release required.
#
# package is a dropdown backed by the allowlist below (the allowlist is still
# enforced server-side to prevent confused-deputy path abuse).
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        type: choice
        default: beta
        options:
          - beta
          - release
      package:
        description: "Package to publish"
        required: true
        type: choice
        options:
          - packages/runtime
          - packages/connectors/http_generic
          - packages/connectors/stripe
          - packages/connectors/smtp
          - packages/connectors/google_drive
          - packages/connectors/fhir_cerner
          - packages/connectors/fhir_epic
          - packages/connectors/salesforce
          - packages/connectors/slack
          - packages/meta

env:
  PIP_AUDIT_VERSION: "2.7.3"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Resolve the version from source and verify prerequisites before building.
  # ─────────────────────────────────────────────────────────────────────────────
  prerequisites:
    name: Verify prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    outputs:
      base_version: ${{ steps.version.outputs.base_version }}
      publish_version: ${{ steps.channel.outputs.publish_version }}
      channel: ${{ inputs.channel }}
      package_path: ${{ steps.validate.outputs.package_path }}
      artifact_slug: ${{ steps.validate.outputs.artifact_slug }}

    steps:
      # Every job pins to this exact commit so all wheels come from one source.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Validate package path (allowlist)
        id: validate
        shell: python
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          import os
          import sys

          raw = os.environ["INPUT_PACKAGE"].strip().replace("\\", "/")
          norm = os.path.normpath(raw).replace("\\", "/")
          if norm.startswith("..") or os.path.isabs(raw):
              print("ERROR: invalid package path", file=sys.stderr)
              sys.exit(1)
          allowed = {
              "packages/runtime",
              "packages/connectors/http_generic",
              "packages/connectors/stripe",
              "packages/connectors/smtp",
              "packages/connectors/google_drive",
              "packages/connectors/fhir_cerner",
              "packages/connectors/fhir_epic",
              "packages/connectors/salesforce",
              "packages/connectors/slack",
              "packages/meta",
          }
          if norm not in allowed:
              print(f"ERROR: package {norm!r} is not allowlisted.", file=sys.stderr)
              print("Allowed:", sorted(allowed), file=sys.stderr)
              sys.exit(1)

          artifact_slug = norm.replace("/", "-")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"package_path={norm}\n")
              out.write(f"artifact_slug={artifact_slug}\n")

          print(f"PASS: package {norm!r} is allowlisted")

      - name: Read version and distribution name from pyproject.toml
        id: version
        shell: python
        env:
          PACKAGE_PATH: ${{ steps.validate.outputs.package_path }}
        run: |
          import os
          import pathlib
          import re
          import sys
          import tomllib

          package_path = pathlib.Path(os.environ["PACKAGE_PATH"])
          project = tomllib.loads(
              (package_path / "pyproject.toml").read_text(encoding="utf-8")
          ).get("project", {})

          dist_name = project.get("name")
          base_version = project.get("version")
          if not dist_name or not base_version:
              print(
                  f"ERROR: {package_path}/pyproject.toml is missing project.name "
                  "or project.version",
                  file=sys.stderr,
              )
              sys.exit(1)

          # The source of truth must be a plain release version; the beta
          # channel appends the pre-release suffix itself.
          if not re.fullmatch(r"\d+\.\d+\.\d+", base_version):
              print(
                  f"ERROR: project.version {base_version!r} is not MAJOR.MINOR.PATCH",
                  file=sys.stderr,
              )
              sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"dist_name={dist_name}\n")
              out.write(f"base_version={base_version}\n")

          print(f"{dist_name} declares version {base_version}")

      # release -> publish the declared version as-is, and refuse if PyPI
      # already has it. beta -> next unused <base>bN on PyPI.
      - name: Resolve version for channel
        id: channel
        shell: python
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          DIST_NAME: ${{ steps.version.outputs.dist_name }}
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
          PACKAGE_PATH: ${{ steps.validate.outputs.package_path }}
        run: |
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          channel = os.environ["INPUT_CHANNEL"]
          dist_name = os.environ["DIST_NAME"]
          base = os.environ["BASE_VERSION"]

          published: set[str] = set()
          url = f"https://pypi.org/pypi/{dist_name}/json"
          try:
              with urllib.request.urlopen(url, timeout=30) as resp:
                  published = set(json.load(resp).get("releases", {}))
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              print(f"{dist_name} has no PyPI releases yet")

          if channel == "release":
              if base in published:
                  print(
                      f"ERROR: {dist_name} {base} is already on PyPI. Bump "
                      f"project.version before publishing a release.",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              publish_version = base
          else:
              beta = re.compile(rf"^{re.escape(base)}b(\d+)$")
              used = [int(m.group(1)) for v in published if (m := beta.match(v))]
              publish_version = f"{base}b{max(used, default=0) + 1}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"publish_version={publish_version}\n")

          print(f"Publishing {dist_name} {publish_version} to the {channel} channel")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              package_path = os.environ.get("PACKAGE_PATH", "")
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write(
                      "\n".join(
                          [
                              "### Publish plan",
                              "",
                              f"- Channel: {channel}",
                              f"- Package: {package_path}",
                              f"- Distribution: {dist_name}",
                              f"- Base version: {base}",
                              f"- Publish version: {publish_version}",
                              "",
                          ]
                      )
                  )

      # Stable only: betas are cut before the changelog section is finalised.
      - name: Verify changelog
        if: inputs.channel == 'release'
        shell: python
        env:
          VERSION: ${{ steps.version.outputs.base_version }}
        run: |
          import os
          import pathlib
          import re
          import sys

          version = os.environ["VERSION"]
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")

          heading = re.compile(
              rf"^## \[{re.escape(version)}\] - \d{{4}}-\d{{2}}-\d{{2}}\s*$",
              re.MULTILINE,
          )
          if not heading.search(changelog):
              print(f"ERROR: CHANGELOG.md is missing a dated [{version}] section", file=sys.stderr)
              sys.exit(1)

          link_pattern = rf"^\[{re.escape(version)}\]: .+/releases/tag/v{re.escape(version)}\s*$"
          if not re.search(link_pattern, changelog, re.MULTILINE):
              print(f"ERROR: CHANGELOG.md is missing the [{version}] release link", file=sys.stderr)
              sys.exit(1)

          print(f"PASS: changelog documents {version}")

      # Stable only: beta versions never get a GitHub Release.
      - name: Verify GitHub Release exists
        if: inputs.channel == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ steps.version.outputs.base_version }}" \
            --json tagName \
            --jq '.tagName'

  # ─────────────────────────────────────────────────────────────────────────────
  # Build the package's one wheel. Every package is pure Python, so a single
  # py3-none-any wheel serves all supported Python versions and platforms;
  # packages/meta is a metadata-only wheel (dependencies, no modules).
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build wheel
    needs: prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # No-op on the release channel; stamps the pre-release version on beta.
      - name: Stamp publish version into pyproject.toml
        shell: python
        env:
          PACKAGE_PATH: ${{ needs.prerequisites.outputs.package_path }}
          PUBLISH_VERSION: ${{ needs.prerequisites.outputs.publish_version }}
        run: |
          import os
          import pathlib
          import re
          import sys
          import tomllib

          version = os.environ["PUBLISH_VERSION"]
          pyproject = pathlib.Path(os.environ["PACKAGE_PATH"]) / "pyproject.toml"

          text = pyproject.read_text(encoding="utf-8")
          patched, count = re.subn(
              r'(?m)^version = ".*"$', f'version = "{version}"', text, count=1
          )
          if count != 1:
              print(f"ERROR: no version line to patch in {pyproject}", file=sys.stderr)
              sys.exit(1)
          pyproject.write_text(patched, encoding="utf-8")

          actual = tomllib.loads(patched)["project"]["version"]
          if actual != version:
              print(f"ERROR: patched version is {actual!r}, expected {version!r}", file=sys.stderr)
              sys.exit(1)

          print(f"PASS: building {pyproject.parent} at version {version}")

      # pyproject.toml pins release minimums, which no beta satisfies (1.0.0b1 <
      # 1.0.0). A beta meta lowers each node-wire-* minimum to its first beta so
      # it pulls beta siblings; a release meta keeps the release-only pins.
      - name: Lower node-wire-* minimums to betas (beta meta only)
        if: needs.prerequisites.outputs.channel == 'beta' && needs.prerequisites.outputs.package_path == 'packages/meta'
        shell: python
        env:
          PACKAGE_PATH: ${{ needs.prerequisites.outputs.package_path }}
        run: |
          import os
          import pathlib
          import re
          import sys
          import tomllib

          pyproject = pathlib.Path(os.environ["PACKAGE_PATH"]) / "pyproject.toml"
          text = pyproject.read_text(encoding="utf-8")

          def to_beta(match: re.Match[str]) -> str:
              parts = match.group(2).split(".")
              base = ".".join(parts + ["0"] * (3 - len(parts)))
              return f'"{match.group(1)}>={base}b1,'

          patched = re.sub(r'"(node-wire-[a-z0-9-]+)>=(\d+(?:\.\d+){0,2}),', to_beta, text)

          deps = tomllib.loads(patched)["project"]["dependencies"]
          ours = [d for d in deps if d.startswith("node-wire-")]
          unpatched = [d for d in ours if not re.search(r">=\d+\.\d+\.\d+b1,", d)]
          if not ours or unpatched:
              print(f"ERROR: node-wire-* deps not lowered to betas: {unpatched or deps}", file=sys.stderr)
              sys.exit(1)
          pyproject.write_text(patched, encoding="utf-8")

          for dep in ours:
              print(f"PASS: {dep}")

      - name: Build wheel
        env:
          PACKAGE_PATH: ${{ needs.prerequisites.outputs.package_path }}
        run: |
          python -m pip install "build==1.2.2"
          python -m build --wheel --outdir "$PACKAGE_PATH/dist" "$PACKAGE_PATH"

      - name: Verify wheel contents
        shell: python
        env:
          PACKAGE_PATH: ${{ needs.prerequisites.outputs.package_path }}
        run: |
          import glob, os, sys, zipfile

          package_path = os.environ["PACKAGE_PATH"]
          wheels = glob.glob(f"{package_path}/dist/*.whl")
          if len(wheels) != 1:
              print(f"ERROR: expected one wheel, found {wheels}", file=sys.stderr)
              sys.exit(1)
          wheel = wheels[0]
          if not wheel.endswith("-py3-none-any.whl"):
              print(f"ERROR: {wheel} is not a py3-none-any wheel", file=sys.stderr)
              sys.exit(1)
          with zipfile.ZipFile(wheel) as zf:
              names = zf.namelist()

          compiled = [n for n in names if n.endswith((".so", ".pyd", ".c"))]
          modules = [n for n in names if n.endswith(".py")]
          if compiled:
              print(f"ERROR: {wheel} contains compiled files:", file=sys.stderr)
              for name in compiled:
                  print(f"  {name}", file=sys.stderr)
              sys.exit(1)
          if package_path == "packages/meta":
              if modules:
                  print(f"ERROR: meta wheel is not metadata-only: {modules}", file=sys.stderr)
                  sys.exit(1)
              print(f"PASS: {wheel} has no modules")
          else:
              if not modules:
                  print(f"ERROR: {wheel} contains no .py modules", file=sys.stderr)
                  sys.exit(1)
              print(f"PASS: {wheel} is pure Python ({len(modules)} modules)")

      - name: Record wheel SHA256 (artifact integrity)
        shell: python
        run: |
          import hashlib, pathlib, sys

          dist = pathlib.Path("${{ needs.prerequisites.outputs.package_path }}") / "dist"
          wheels = sorted(dist.glob("*.whl"))
          if not wheels:
              print("ERROR: no wheels to hash", file=sys.stderr)
              sys.exit(1)
          lines = []
          for w in wheels:
              h = hashlib.sha256(w.read_bytes()).hexdigest()
              line = f"{h}  {w.name}"
              print(line)
              lines.append(line)
          (dist / "sha256sums.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-py3-${{ needs.prerequisites.outputs.publish_version }}-${{ needs.prerequisites.outputs.artifact_slug }}
          path: ${{ needs.prerequisites.outputs.package_path }}/dist/*
          retention-days: 1
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # Collect the wheel, run supply-chain checks, publish to PyPI.
  # Uses Trusted Publisher (OIDC) — no long-lived PyPI API tokens needed.
  # Configure on PyPI: Settings → Publishing → Add Publisher (GitHub, this repo,
  # workflow name = "Publish Node Wire package").
  # ─────────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    needs: [prerequisites, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Download wheel artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*-${{ needs.prerequisites.outputs.publish_version }}-${{ needs.prerequisites.outputs.artifact_slug }}
          path: dist-all
          merge-multiple: true

      - name: Flatten into dist/ directory
        run: |
          mkdir -p dist
          find dist-all -name "*.whl" -exec cp {} dist/ \;
          echo "Wheels collected:"
          ls dist/

      # Written outside dist/ — pypa/gh-action-pypi-publish uploads every file
      # under packages-dir, and a checksums file isn't a valid distribution.
      - name: Record checksums
        run: |
          sha256sum dist/*.whl | tee sha256sums.txt
          {
            echo "### Wheels (${{ needs.prerequisites.outputs.publish_version }})"
            echo ""
            echo '```'
            cat sha256sums.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload wheel checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-checksums-${{ needs.prerequisites.outputs.publish_version }}-${{ needs.prerequisites.outputs.artifact_slug }}
          path: sha256sums.txt
          retention-days: 30
          if-no-files-found: error

      - name: Validate wheel version matches resolved version
        shell: python
        run: |
          import glob, sys

          expected = "${{ needs.prerequisites.outputs.publish_version }}"
          wheels = glob.glob("dist/*.whl")
          if not wheels:
              print("ERROR: No wheels found for publish", file=sys.stderr)
              sys.exit(1)

          bad = [
              w for w in wheels
              if f"-{expected}-" not in w and f"-{expected.replace('.', '_')}-" not in w
          ]
          if bad:
              print(f"ERROR: Version mismatch. Expected {expected!r} in filename.", file=sys.stderr)
              for w in bad:
                  print(f"  {w}", file=sys.stderr)
              sys.exit(1)

          print(f"PASS: {len(wheels)} wheel(s) match version {expected!r}")

      # Connectors depend on node-wire-runtime, and meta on runtime plus every
      # connector; those may not be on PyPI yet at a satisfying version, so
      # install them from this commit, as security-pr.yml does.
      # scripts/meta_local_deps.py derives meta's list from its pyproject and
      # fails if a dependency has no local package.
      # No --pre: it would let third-party deps resolve to pre-releases, so
      # pip-audit would scan versions users never get. It isn't needed either:
      # pip accepts explicitly named paths and wheels at any version, and the
      # local sources carry plain release versions, which satisfy both release
      # minimums and a beta meta's lowered >=X.Y.Zb1 ones.
      - name: Install built wheel for CVE scan
        shell: bash
        env:
          PACKAGE_PATH: ${{ needs.prerequisites.outputs.package_path }}
        run: |
          if [[ "${PACKAGE_PATH}" == "packages/meta" ]]; then
            deps_file="${RUNNER_TEMP}/meta-local-deps.txt"
            python scripts/meta_local_deps.py > "${deps_file}"
            local_deps=()
            while IFS= read -r dep; do local_deps+=("${dep}"); done < "${deps_file}"
            pip install "${local_deps[@]}" dist/*.whl
          elif [[ "${PACKAGE_PATH}" == "packages/runtime" ]]; then
            pip install dist/*.whl
          else
            pip install packages/runtime dist/*.whl
          fi

      # pip-audit scans the whole environment. ubuntu-latest's Python still
      # ships setuptools 79.0.1 (PYSEC-2026-3447); the fix is 83.0.0. That
      # copy is not part of the wheel — same upgrade as security-pr.yml.
      - name: Vulnerability scan (CVE gate — blocks publish on any known vuln)
        shell: bash
        env:
          AUDIT_TITLE: ${{ needs.prerequisites.outputs.package_path }}
        run: |
          python -m pip install --upgrade "setuptools>=83.0.0"
          python -m pip install "pip-audit==${{ env.PIP_AUDIT_VERSION }}"
          set +e
          pip-audit -s osv --format json --output pip-audit.json --progress-spinner off
          audit_status=$?
          python scripts/ci_step_summary.py pip-audit pip-audit.json --title "${AUDIT_TITLE}"
          summary_status=$?
          if [[ "${audit_status}" -ne 0 ]]; then
            exit "${audit_status}"
          fi
          exit "${summary_status}"

      - name: Publish to PyPI (Trusted Publisher / OIDC + Sigstore attestations)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true

      - name: Report PyPI publish
        run: |
          {
            echo "### Published to PyPI"
            echo "- Package: ${{ needs.prerequisites.outputs.package_path }}"
            echo "- Version: ${{ needs.prerequisites.outputs.publish_version }}"
            echo "- Channel: ${{ needs.prerequisites.outputs.channel }}"
            echo "- Attestations: enabled"
          } >> "$GITHUB_STEP_SUMMARY"
