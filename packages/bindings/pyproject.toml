[project]
name = "node-wire-bindings"
version = "1.0.0"
description = "Node Wire bindings — MCP host surface (factory, invoke, mcp_server)"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "AOT Technologies", email = "opensource@aot-technologies.com" }]
readme = "README.md"

dependencies = [
    "node-wire-runtime>=1.0.0",
    "mcp>=1.6.0,<2",
    "PyJWT[crypto]>=2.8.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
]

[build-system]
requires = ["setuptools>=69.0.0", "cython>=3.0", "wheel"]
build-backend = "setuptools.build_meta"

# MCP image surface only — REST/gRPC stay in the monorepo editable install.
[tool.setuptools.packages.find]
where = ["../../src"]
include = ["bindings", "bindings.mcp_server"]
exclude = ["bindings.rest_api*", "bindings.grpc_server*"]
