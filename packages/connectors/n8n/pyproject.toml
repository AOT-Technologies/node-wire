[project]
name = "node-wire-n8n"
version = "1.1.2"
description = "Node Wire connector — n8n (hand-written, n8n public API)"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "AOT Technologies", email = "opensource@aot-technologies.com" }]

dependencies = [
    "node-wire-runtime>=1.1.3",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.entry-points."node_wire.connectors"]
n8n = "node_wire_n8n.logic"

[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["../../../src"]
include = ["node_wire_n8n*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
