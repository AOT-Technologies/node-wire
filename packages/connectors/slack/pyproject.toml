[project]
name = "node-wire-slack"
version = "1.1.0"
description = "Node Wire connector for Slack: post channel messages, send direct messages and upload files"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "AOT Technologies", email = "opensource@aot-technologies.com" }]
maintainers = [{ name = "AOT Technologies", email = "opensource@aot-technologies.com" }]
keywords = ["node-wire", "connector", "mcp", "slack", "chat", "messaging"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Communications :: Chat",
]

dependencies = [
    "node-wire-runtime>=1.1.0",
    "httpx[http2]>=0.27.0,<0.29.0",
]

[project.entry-points."node_wire.connectors"]
slack = "node_wire_slack.logic"

[project.urls]
Homepage = "https://github.com/AOT-Technologies/node-wire"
Documentation = "https://aot-technologies.github.io/node-wire/slack_connector/"
Repository = "https://github.com/AOT-Technologies/node-wire"
Issues = "https://github.com/AOT-Technologies/node-wire/issues"
Changelog = "https://github.com/AOT-Technologies/node-wire/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["../../../src"]
include = ["node_wire_slack*"]
