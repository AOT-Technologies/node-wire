[project]
name = "node-wire-postgres"
version = "1.1.2"
description = "Node Wire connector — postgres (hand-written, psycopg 3)"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "AOT Technologies", email = "opensource@aot-technologies.com" }]

dependencies = [
    "node-wire-runtime>=1.1.3",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "polyfactory>=2.16.0",
]

[project.entry-points."node_wire.connectors"]
postgres = "node_wire_postgres.logic"

[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["../../../src"]
include = ["node_wire_postgres*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
