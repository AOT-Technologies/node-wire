[project]
name = "node-wire-toolhive"
version = "1.1.0"
description = "Node Wire layer for stacklok-built MCP servers behind ToolHive: credential relay, tenant header and config-selection tools"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "AOT Technologies", email = "opensource@aot-technologies.com" }]
maintainers = [{ name = "AOT Technologies", email = "opensource@aot-technologies.com" }]
keywords = ["node-wire", "mcp", "toolhive", "stacklok", "connectors"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "node-wire-runtime>=1.1.0",
    # ConnectorFactory(auth_provider_hook=...) — added alongside this package.
    "node-wire-bindings>=1.1.0",
    "mcp>=1.6.0,<2",
]

[project.urls]
Homepage = "https://github.com/AOT-Technologies/node-wire"
Documentation = "https://aot-technologies.github.io/node-wire/stacklok-mcp-servers/"
Repository = "https://github.com/AOT-Technologies/node-wire"
Issues = "https://github.com/AOT-Technologies/node-wire/issues"
Changelog = "https://github.com/AOT-Technologies/node-wire/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["node_wire_toolhive"]
