[project]
name = "node-wire-toolhive"
version = "1.1.0"
description = "Node Wire layer for stacklok-built MCP servers behind ToolHive (credential relay, tenant header, config tools)"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "AOT Technologies", email = "opensource@aot-technologies.com" }]
readme = "README.md"

dependencies = [
    "node-wire-runtime>=1.1.0",
    # ConnectorFactory(auth_provider_hook=...) — added alongside this package.
    "node-wire-bindings>=1.1.0",
    "mcp>=1.6.0,<2",
]

[build-system]
requires = ["setuptools>=69.0.0", "cython>=3.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["node_wire_toolhive"]
