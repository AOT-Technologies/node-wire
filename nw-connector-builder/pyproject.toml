[project]
name = "nw-connector-builder"
version = "0.1.0"
description = "Generate node-wire connectors from Swagger/OpenAPI specs"
requires-python = ">=3.11"
dependencies = [
    "prance[osv]>=0.22.2",
    "datamodel-code-generator>=0.26.0",
    "ruamel.yaml>=0.18.0",
    "pydantic>=2.6.0,<3.0.0",
    "httpx[http2]>=0.27.0,<0.28.0",
    "nw-mcp-builder",
    "node-wire-runtime",
    "pytest>=8.0.0",
    "polyfactory>=2.16.0",
    "PyYAML>=6.0.1",
]

[project.scripts]
nw-connector-builder = "nw_connector_builder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nw_connector_builder"]

[tool.uv.sources]
nw-mcp-builder = { path = "../nw-mcp-builder", editable = true }
node-wire-runtime = { path = "../packages/runtime", editable = true }
